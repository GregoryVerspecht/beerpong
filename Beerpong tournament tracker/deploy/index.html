document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

style=\"display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:18px 14px;border-radius:16px;border:1px solid {{ champBorder }};background:{{ champBg }}\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:.16em;color:{{ champLabelColor }}\">CHAMPION<\u002Fdiv>\n        <div style=\"width:20px;height:20px;border-radius:50%;background:{{ champDot }}\"><\u002Fdiv>\n        <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:32px;line-height:1;color:{{ champText }};text-wrap:balance\">{{ champLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"font-size:12px;color:#5c574e;text-align:center;text-wrap:pretty\">Gold spots qualify; \"↝\" shows the projected match while groups are still playing. Winners move down to the next round — tap a match to score it.<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ vStats }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#151412;border:1px solid #2a2823;border-radius:18px;padding:14px 16px 6px\">\n      <div style=\"display:grid;grid-template-columns:22px 1fr 44px 44px;gap:6px;font-size:11px;font-weight:600;letter-spacing:.12em;color:#a8a194;padding-bottom:10px;border-bottom:1px solid #2a2823;align-items:baseline\"><span style=\"font-family:'Barlow Condensed';font-size:18px;color:#f2b544;letter-spacing:0;white-space:nowrap\">MVP<\u002Fspan><span style=\"font-size:10px;padding-left:22px\">cups sunk per player<\u002Fspan><span style=\"text-align:right\">CUPS<\u002Fspan><span style=\"text-align:right\">/GM<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ mvp }}\" as=\"p\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:22px 1fr 44px 44px;gap:6px;align-items:center;padding:11px 0;border-bottom:1px solid #1f1e1a;font-size:18px;font-family:'Barlow Condensed';font-weight:600\">\n          <span style=\"color:{{ p.rankColor }}\">{{ p.rank }}<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ p.team.color }};flex:none\"><\u002Fspan><span style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.name }}<\u002Fspan><span style=\"font-size:11px;font-family:Barlow;color:#a8a194;white-space:nowrap\">{{ p.team.name }}<\u002Fspan><\u002Fspan>\n          <span style=\"text-align:right;color:#f2b544;font-weight:800\">{{ p.cups }}<\u002Fspan><span style=\"text-align:right;color:#a8a194\">{{ p.avg }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ noMvp }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:14px 0;color:#5c574e;font-size:13px\">No cups sunk yet.<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"background:#151412;border:1px solid #2a2823;border-radius:18px;padding:14px 16px 6px\">\n      <div style=\"display:grid;grid-template-columns:1fr 40px 44px 44px;gap:6px;font-size:11px;font-weight:600;letter-spacing:.12em;color:#a8a194;padding-bottom:10px;border-bottom:1px solid #2a2823;align-items:baseline\"><span style=\"font-family:'Barlow Condensed';font-size:18px;color:#f2b544;letter-spacing:0\">TEAMS<\u002Fspan><span style=\"text-align:right\">GP<\u002Fspan><span style=\"text-align:right\">WIN%<\u002Fspan><span style=\"text-align:right\">CUPS<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ teamStats }}\" as=\"t\" hint-placeholder-count=\"8\">\n        <div style=\"display:grid;grid-template-columns:1fr 40px 44px 44px;gap:6px;align-items:center;padding:11px 0;border-bottom:1px solid #1f1e1a;font-size:18px;font-family:'Barlow Condensed';font-weight:600\">\n          <span style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ t.color }};flex:none\"><\u002Fspan><span style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ t.name }}<\u002Fspan><\u002Fspan>\n          <span style=\"text-align:right;color:#a8a194\">{{ t.gp }}<\u002Fspan><span style=\"text-align:right\">{{ t.winPct }}<\u002Fspan><span style=\"text-align:right;color:#f2b544;font-weight:800\">{{ t.cups }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ vSetup }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;gap:4px;background:#151412;border:1px solid #2a2823;border-radius:12px;padding:4px\">\n      <sc-for list=\"{{ secs }}\" as=\"sc\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ sc.go }}\" style=\"flex:1;min-height:40px;border-radius:10px;border:0;background:{{ sc.bg }};color:{{ sc.color }};font-size:11px;font-weight:700;letter-spacing:.06em;padding:0 4px\">{{ sc.label }}<\u002Fbutton><\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ hasRec }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"border:1px solid #3a3730;background:#151412;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px\"><div style=\"flex:1;font-size:13px;color:#f4efe6;line-height:1.4;text-wrap:pretty\"><b style=\"color:#f2b544\">Recommended for {{ teamCount }} teams:<\u002Fb> {{ recText }}<\u002Fdiv><button sc-camel-on-click=\"{{ applyRec }}\" style=\"min-height:40px;padding:0 14px;border-radius:10px;border:0;background:#f2b544;color:#1a1408;font-size:12px;font-weight:700;flex:none\">Apply<\u002Fbutton><\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ showRules }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#151412;border:1px solid #2a2823;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;color:#a8a194\">FORMAT<\u002Fdiv><div style=\"font-size:11px;color:#5c574e\">{{ teamCount }} teams<\u002Fdiv><\u002Fdiv>\n      <div style=\"font-size:12px;color:#a8a194;line-height:1.45;text-wrap:pretty\">Everyone first plays in a <b style=\"color:#f4efe6\">group<\u002Fb> (round robin — each team meets every other team in its group). The best teams then go to the <b style=\"color:#f4efe6\">knockout<\u002Fb>: lose once and you're out, until one champion remains.<\u002Fdiv>\n      <div style=\"font-size:12px;color:#a8a194;margin-top:2px\">Groups<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px\">\n        <sc-for list=\"{{ groupOptions }}\" as=\"o\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ o.pick }}\" style=\"text-align:left;min-height:44px;padding:12px;border-radius:10px;border:1px solid {{ o.border }};background:{{ o.bg }};color:#f4efe6;display:flex;flex-direction:column;gap:4px\"><span style=\"display:flex;justify-content:space-between;gap:6px;width:100%\"><span style=\"font-family:'Barlow Condensed';font-weight:800;font-size:20px;line-height:1\">{{ o.title }}<\u002Fspan><sc-if value=\"{{ o.rec }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:9px;font-weight:700;letter-spacing:.1em;color:#f2b544\">BEST FIT<\u002Fspan><\u002Fsc-if><\u002Fspan><span style=\"font-size:12px;color:#a8a194;line-height:1.4\">{{ o.desc }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ noGroupOptions }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:#ff7a6b\">Add at least 2 teams to choose a format.<\u002Fdiv><\u002Fsc-if>\n      <div style=\"font-size:12px;color:#a8a194;margin-top:2px\">Knockout — how many teams go through<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px\">\n        <sc-for list=\"{{ koOptions }}\" as=\"o\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ o.pick }}\" style=\"text-align:left;min-height:44px;padding:12px;border-radius:10px;border:1px solid {{ o.border }};background:{{ o.bg }};color:#f4efe6;display:flex;flex-direction:column;gap:4px\"><span style=\"display:flex;justify-content:space-between;gap:6px;width:100%\"><span style=\"font-family:'Barlow Condensed';font-weight:800;font-size:20px;line-height:1\">{{ o.title }}<\u002Fspan><sc-if value=\"{{ o.rec }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:9px;font-weight:700;letter-spacing:.1em;color:#f2b544\">BEST FIT<\u002Fspan><\u002Fsc-if><\u002Fspan><span style=\"font-size:12px;color:#a8a194;line-height:1.4\">{{ o.desc }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background:#0c0b09;border:1px solid #2a2823;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;color:#a8a194\">YOUR PLAN<\u002Fdiv><div style=\"font-size:13px;color:#f4efe6;line-height:1.5;text-wrap:pretty\">{{ planText }}<\u002Fdiv><\u002Fdiv>\n\n      <sc-if value=\"{{ sim.valid }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#151412;border:1px solid #2a2823;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center\">\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:.14em;color:#a8a194\">ESTIMATED LENGTH · WORST CASE<\u002Fdiv>\n          <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:36px;line-height:1;color:#f2b544\">{{ sim.hours }}h {{ sim.mins }}m<\u002Fdiv>\n          <div style=\"font-size:12px;color:#a8a194\">{{ sim.totalGames }} games across {{ sim.tables }} table(s), each capped at {{ sim.maxTimer }} min<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;color:#a8a194;margin-top:4px\">GAME RULES<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#a8a194\">Cups per side<input type=\"number\" min=\"1\" max=\"21\" value=\"{{ s.cups }}\" sc-camel-on-change=\"{{ setCups }}\" style=\"min-height:44px;background:#0c0b09;border:1px solid #2a2823;border-radius:10px;color:#f4efe6;padding:0 12px;font-size:18px;font-family:'Barlow Condensed';font-weight:600\"><span style=\"font-size:11px;color:#5c574e;line-height:1.4\">Cups each team starts with. 10 is standard; 6 makes games ~40% shorter.<\u002Fspan><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#a8a194\">Default timer (min)<input type=\"number\" min=\"1\" max=\"60\" value=\"{{ s.timerMin }}\" sc-camel-on-change=\"{{ setTimerMin }}\" style=\"min-height:44px;background:#0c0b09;border:1px solid #2a2823;border-radius:10px;color:#f4efe6;padding:0 12px;font-size:18px;font-family:'Barlow Condensed';font-weight:600\"><span style=\"font-size:11px;color:#5c574e;line-height:1.4\">Max game length. Time up → most cups left wins; equal → sudden death, next cup wins. Set per table in the Tables step.<\u002Fspan><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#a8a194\">Points per win<input type=\"number\" min=\"1\" max=\"10\" value=\"{{ s.pointsWin }}\" sc-camel-on-change=\"{{ setPointsWin }}\" style=\"min-height:44px;background:#0c0b09;border:1px solid #2a2823;border-radius:10px;color:#f4efe6;padding:0 12px;font-size:18px;font-family:'Barlow Condensed';font-weight:600\"><span style=\"font-size:11px;color:#5c574e;line-height:1.4\">Group points for a win. A loss is 0. Only affects the standings display.<\u002Fspan><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#a8a194\">Tiebreaker<sc-raw-select value=\"{{ s.tiebreaker }}\" sc-camel-on-change=\"{{ setTiebreaker }}\" style=\"min-height:44px;background:#0c0b09;border:1px solid #2a2823;border-radius:10px;color:#f4efe6;padding:0 10px;font-size:15px\"><option value=\"cupdiff\">Cup difference<\u002Foption><option value=\"cupshit\">Cups hit<\u002Foption><option value=\"wins\">Wins only<\u002Foption><\u002Fsc-raw-select><span style=\"font-size:11px;color:#5c574e;line-height:1.4\">{{ tiebreakerHelp }}<\u002Fspan><\u002Flabel>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ toggleSound }}\" style=\"min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-radius:10px;border:1px solid #2a2823;background:#0c0b09;color:#f4efe6;font-size:14px;font-weight:600\"><span>Sound &amp; haptics on cup sink<\u002Fspan><span style=\"width:44px;height:26px;border-radius:13px;background:{{ soundBg }};position:relative;flex:none;transition:background .2s\"><span style=\"position:absolute;top:3px;left:{{ soundKnob }}px;width:20px;height:20px;border-radius:50%;background:#f4efe6;transition:left .2s\"><\u002Fspan><\u002Fspan><\u002Fbutton>\n      <button sc-camel-on-click=\"{{ toggleNotify }}\" style=\"min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-radius:10px;border:1px solid #2a2823;background:#0c0b09;color:#f4efe6;font-size:14px;font-weight:600;gap:10px\"><span style=\"display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left\"><span>Notify when a table is free<\u002Fspan><span style=\"font-size:11px;color:#5c574e;font-weight:500\">{{ notifyHelp }}<\u002Fspan><\u002Fspan><span style=\"width:44px;height:26px;border-radius:13px;background:{{ notifyBg }};position:relative;flex:none;transition:background .2s\"><span style=\"position:absolute;top:3px;left:{{ notifyKnob }}px;width:20px;height:20px;border-radius:50%;background:#f4efe6;transition:left .2s\"><\u002Fspan><\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showTeams }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#151412;border:1px solid #2a2823;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#a8a194\">Tournament name<input value=\"{{ meta.name }}\" sc-camel-on-change=\"{{ setName }}\" style=\"min-height:44px;background:#0c0b09;border:1px solid #2a2823;border-radius:10px;color:#f4efe6;padding:0 12px;font-size:18px;font-family:'Barlow Condensed';font-weight:600\"><\u002Flabel>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:6px\"><div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;color:#a8a194\">TEAMS · {{ teamCount }}<\u002Fdiv><button sc-camel-on-click=\"{{ addTeam }}\" style=\"min-height:36px;padding:0 12px;border-radius:10px;border:1px solid #3a3730;background:transparent;color:#f2b544;font-size:12px;font-weight:600\">+ Add<\u002Fbutton><\u002Fdiv>\n      <sc-for list=\"{{ teamsEdit }}\" as=\"t\" hint-placeholder-count=\"8\">\n        <div style=\"display:grid;grid-template-columns:44px 1fr 44px 44px 40px;gap:6px;align-items:center;padding-bottom:10px;border-bottom:1px solid #1f1e1a\">\n          <input type=\"color\" value=\"{{ t.color }}\" sc-camel-on-change=\"{{ t.onColor }}\" style=\"width:44px;height:44px;padding:0;border:1px solid #2a2823;border-radius:10px;background:#0c0b09\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n            <input value=\"{{ t.name }}\" sc-camel-on-change=\"{{ t.onName }}\" placeholder=\"Team name\" style=\"min-height:44px;background:#0c0b09;border:1px solid #2a2823;border-radius:10px;color:#f4efe6;padding:0 12px;font-size:15px;min-width:0\">\n            <input value=\"{{ t.playersText }}\" sc-camel-on-change=\"{{ t.onPlayers }}\" sc-camel-on-blur=\"{{ t.onPlayersBlur }}\" placeholder=\"Players, comma separated\" style=\"min-height:40px;background:#0c0b09;border:1px solid #2a2823;border-radius:10px;color:#a8a194;padding:0 12px;font-size:13px;min-width:0\">\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ t.toggleSeed }}\" title=\"Seeded team\" style=\"min-height:44px;border-radius:10px;border:1px solid #3a3730;background:{{ t.seedBg }};color:{{ t.seedColor }};font-size:18px\">★<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ t.cycleGroup }}\" style=\"min-height:44px;border-radius:10px;border:1px solid #3a3730;background:#1f1e1a;color:#f2b544;font-family:'Barlow Condensed';font-weight:800;font-size:18px\">{{ t.group }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ t.remove }}\" style=\"min-height:44px;border-radius:10px;border:1px solid #2a2823;background:transparent;color:#a8a194;font-size:16px\" style-hover=\"color:#ff7a6b;border-color:#5a1c1c\">×<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size:12px;color:#5c574e;line-height:1.45;text-wrap:pretty\">Add players by name so each cup counts toward their MVP stats. Solo players make a one-person team; a spare player can join any duo. ★ marks a seed (strong team) so the draw keeps seeds in different groups. Tap the letter to move a team between groups.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showDraw }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#151412;border:1px solid #2a2823;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-size:12px;color:#a8a194;line-height:1.45;text-wrap:pretty\">Randomly deal teams into groups. Seeds (★) are spread first so they don't meet early. Redraw as often as you like, or drag teams to fix the result by hand.<\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\"><div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;color:#a8a194\">POOL DRAW<\u002Fdiv><button sc-camel-on-click=\"{{ drawGroups }}\" style=\"min-height:40px;padding:0 14px;border-radius:10px;border:0;background:#f2b544;color:#1a1408;font-size:12px;font-weight:700;letter-spacing:.04em\">⚄ {{ drawLabel }}<\u002Fbutton><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px\">\n        <sc-for list=\"{{ pools }}\" as=\"p\" hint-placeholder-count=\"2\">\n          <div sc-camel-on-drag-over=\"{{ p.dragOver }}\" sc-camel-on-drop=\"{{ p.drop }}\" style=\"background:#0c0b09;border:1px dashed {{ p.border }};border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px\">\n            <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-family:'Barlow Condensed';font-weight:800;font-size:22px;color:#f2b544;white-space:nowrap;line-height:1\">{{ p.name }}<\u002Fspan><span style=\"font-size:11px;color:{{ p.subColor }}\">{{ p.sub }}<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{ p.teams }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <div draggable=\"{{ true }}\" sc-camel-on-drag-start=\"{{ t.dragStart }}\" sc-camel-on-click=\"{{ t.cycleGroup }}\" title=\"Drag to another pool, or tap to move\" style=\"display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed';font-weight:600;font-size:17px;padding:8px 8px;border-radius:8px;background:#151412;cursor:grab;min-height:36px\" style-hover=\"background:#1f1e1a\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ t.color }};flex:none\"><\u002Fspan><span style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ t.name }}<\u002Fspan><sc-if value=\"{{ t.seed }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#f2b544;font-size:12px;margin-left:auto\">★<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:{{ drawNoteColor }};line-height:1.45;text-wrap:pretty\">{{ drawNote }}<\u002Fdiv>\n      <sc-if value=\"{{ notWizard }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ regenerate }}\" style=\"min-height:44px;border-radius:10px;border:1px solid #3a3730 >\n        <span style=\"width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:19px;line-height:1\">{{ t.glyph }}<\u002Fspan>\n        <span style=\"font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;font-size:10px;font-weight:590;letter-spacing:.01em\">{{ t.label }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ wizardOn }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;box-sizing:border-box;background:rgba(12,11,9,.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid #1f1e1a;display:flex;gap:10px;padding:10px calc(20px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));z-index:30\">\n    <button sc-camel-on-click=\"{{ wizBack }}\" style=\"min-height:52px;padding:0 18px;border-radius:10px;border:1px solid #3a3730;background:transparent;color:#f4efe6;font-size:14px;font-weight:600\">{{ wizBackLabel }}<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ wizNext }}\" disabled=\"{{ wizBlocked }}\" style=\"flex:1;min-height:52px;border-radius:10px;border:0;background:{{ wizNextBg }};color:{{ wizNextColor }};font-family:'Barlow Condensed';font-weight:800;font-size:20px;letter-spacing:.04em\">{{ wizNextLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<sc-if value=\"{{ confirmOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ confirmCancel }}\" style=\"position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom))\">\n  <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:398px;background:#151412;border:1px solid #3a3730;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;animation:pop .25s ease-out\">\n    <div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:24px;line-height:1.05;text-wrap:balance\">{{ cf.title }}<\u002Fdiv>\n    <div style=\"font-size:14px;color:#a8a194;line-height:1.5;text-wrap:pretty\">{{ cf.body }}<\u002Fdiv>\n    <div style=\"display:flex;gap:10px;margin-top:8px\">\n      <button sc-camel-on-click=\"{{ confirmCancel }}\" style=\"flex:1;min-height:50px;border-radius:10px;border:1px solid #3a3730;background:transparent;color:#f4efe6;font-size:14px;font-weight:600\">Cancel<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ confirmOk }}\" style=\"flex:1;min-height:50px;border-radius:10px;border:0;background:{{ cf.okBg }};color:{{ cf.okColor }};font-family:'Barlow Condensed';font-weight:800;font-size:18px;letter-spacing:.04em\">{{ cf.ok }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ scoringOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;background:#0c0b09;z-index:20;display:flex;justify-content:center;overflow:auto;padding-bottom:calc(60px + env(safe-area-inset-bottom));box-sizing:border-box\">\n<div style=\"width:100%;max-width:430px;min-height:100%;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));box-sizing:border-box;gap:12px;position:relative\">\n  {{ confetti }}\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n    <button sc-camel-on-click=\"{{ closeScoring }}\" style=\"min-height:44px;min-width:44px;border-radius:10px;border:1px solid #2a2823;background:#151412;color:#f4efe6;font-size:18px;font-weight:600\" style-active=\"opacity:.6\">‹<\u002Fbutton>\n    <div style=\"text-align:center\"><div style=\"font-size:11px;font-weight:600;letter-spacing:.12em;color:#a8a194\">{{ sg.tableName }} · {{ sg.stageLabel }}<\u002Fdiv><div style=\"font-family:'Barlow Condensed';font-weight:800;font-size:40px;line-height:1;color:{{ sg.timerColor }}\">{{ sg.timer }}<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:6px\">\n      <button sc-camel-on-click=\"{{ sg.togglePause }}\" style=\"min-height:44px;min-width:44px;border-radius:10px;border:1px solid #2a2823;background:#151412;color:#f4efe6;font-size:12px;font-weight:600\">{{ sg.pauseLabel }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ sg.addMinute }}\" style=\"min-height:44px;min-width:44px;border-radius:10px;border:1px solid #2a2823;background:#151412;color:#f4efe6;font-size:12px;font-weight:600\">+1m<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ sg.isSudden }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border:1px solid #5a1c1c;border-radius:10px;padding:7px;text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:16px;color:#ff7a6b;letter-spacing:.08em;animation:flash 1.4s infinite\">SUDDEN DEATH — NEXT CUP WINS<\u002Fdiv><\u002Fsc-if>\n  <sc-if value=\"{{ sg.lastCup }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border:1px solid #f2b544;background:#1c170c;border-radius:10px;padding:7px;text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:16px;color:#f2b544;letter-spacing:.08em\">LAST CUP — {{ sg.lastCupTeam }} ON THE BRINK<\u002Fdiv><\u002Fsc-if>\n\n  <sc-if value=\"{{ sg.isDone }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;animation:pop .5s ease-out\">\n      <div style=\"font-size:12px;font-weight:600;letter-spacing:.16em;color:#a8a194\">WINNER<\u002Fdiv>\n      <div style=\"width:22px;height:22px;border-radius:50%;background:{{ sg.winnerColor }}\"><\u002Fdiv>\n      <div style=\"font-family:'Barlow Condensed
